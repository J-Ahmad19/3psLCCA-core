<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3psLCCA Professional WebAssembly Demo</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/J-Ahmad19/3psLCCA-core@main/lcca_wasm_api.js"></script> 

    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 30px; display: flex; gap: 30px; max-width: 1200px; margin: auto; }
        h2 { color: #ffffff; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel { background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; }
        .sidebar { flex: 1; min-width: 300px; }
        .main { flex: 2; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s;}
        button:hover:not(:disabled) { background: #1d4ed8; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #fbbf24; font-weight: bold; }
        pre { background: #000; padding: 15px; border-radius: 5px; color: #5ce6cd; overflow-x: auto; font-size: 13px; max-height: 600px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="panel sidebar">
        <h2>Input Parameters</h2>
        <div class="form-group"><label>Initial Construction Cost (₹)</label><input type="number" id="cost" value="12843979.44"></div>
        <div class="form-group"><label>Initial Carbon Emissions Cost (₹)</label><input type="number" id="carbon" value="2065434.91"></div>
        <div class="form-group"><label>Superstructure Cost (₹)</label><input type="number" id="super" value="9356038.92"></div>
        <div class="form-group"><label>Total Scrap Value (₹)</label><input type="number" id="scrap" value="2164095.02"></div>
        <button id="calcBtn" onclick="runCalculation()">Run LCCA Analysis</button>
        <div id="status">Waiting for engine...</div>
    </div>

    <div class="panel main">
        <h2>Engine Output (JSON)</h2>
        <pre id="output">Initialize the engine to see results...</pre>
    </div>

    <script>
        const WHL_URL = "https://cdn.jsdelivr.net/gh/J-Ahmad19/3psLCCA-core@main/dist/three_ps_lcca_core-0.0.0-py3-none-any.whl";
        const engine = new LCCAEngine(WHL_URL);
        let isEngineLoaded = false;

        window.onload = async () => {
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('calcBtn');
            btn.disabled = true;
            statusEl.innerText = "Downloading WebAssembly Engine...";
            
            try {
                await engine.init();
                isEngineLoaded = true;
                statusEl.innerText = "Engine Ready! Waiting for inputs.";
                statusEl.style.color = "#34d399";
                btn.disabled = false;
            } catch (e) {
                statusEl.innerText = "Failed to load engine.";
                statusEl.style.color = "#f87171";
                console.error(e);
            }
        };

        async function runCalculation() {
            if (!isEngineLoaded) return;

            const btn = document.getElementById('calcBtn');
            const statusEl = document.getElementById('status');
            const outputEl = document.getElementById('output');
            
            btn.disabled = true;
            statusEl.innerText = "Calculating...";
            statusEl.style.color = "#fbbf24";
            outputEl.innerText = "Processing...";

            try {
                // 1. Build the payload from the HTML form
                const frontendPayload = {
                    "initial_construction_cost": parseFloat(document.getElementById('cost').value),
                    "initial_carbon_emissions_cost": parseFloat(document.getElementById('carbon').value),
                    "superstructure_construction_cost": parseFloat(document.getElementById('super').value),
                    "total_scrap_value": parseFloat(document.getElementById('scrap').value)
                };

                // 2. Call the API with ONLY the payload
                const results = await engine.calculate(frontendPayload);
                
                outputEl.innerText = JSON.stringify(results, null, 2);
                statusEl.innerText = "Analysis Complete!";
                statusEl.style.color = "#34d399";
                
            } catch (error) {
                outputEl.innerText = "ERROR:\n" + error.message;
                statusEl.innerText = "Calculation Failed.";
                statusEl.style.color = "#f87171";
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
